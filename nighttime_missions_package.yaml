              is_state('input_boolean.night_child_two_go_potty', 'on') and
              is_state('input_boolean.night_child_two_bedtime_bravery', 'on')
              and now() >= today_at('16:00')
              and is_state('input_boolean.night_child_two_star_' ~ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()], 'off')
