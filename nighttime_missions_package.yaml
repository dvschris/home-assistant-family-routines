            }}
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: '{{ ''input_boolean.night_child_three_star_'' ~ [''mon'',''tue'',''wed'',''thu'',''fri'',''sat'',''sun''][now().weekday()]
        }}'
  mode: single
script:
  night_missions_reroll_animations:
    alias: Nighttime Missions — Reroll animations (no task reset)
    mode: single
    sequence:
    - variables:
        pool:
        - bounce
        - twirl
        - wiggle
        - float
        - dance
        - cartwheel
        - heartbeat
        - orbit
        - jump
        - swing
        - disco
        - rocket
        - skate
        - shooting
        child_one_previous: '{{ states(''input_select.night_child_one_animation'') }}'
        child_two_previous: '{{ states(''input_select.night_child_two_animation'') }}'
        child_three_previous: '{{ states(''input_select.night_child_three_animation'') }}'
    - variables:
        child_one_pick: '{{ (pool | reject(''equalto'', child_one_previous) | list) | random }}'
    - variables:
        child_two_pick: '{{ (pool | reject(''equalto'', child_two_previous) | reject(''equalto'', child_one_pick) | list) | random
          }}'
    - variables:
        child_three_pick: '{{ (pool | reject(''equalto'', child_three_previous) | reject(''equalto'', child_one_pick) | reject(''equalto'',
          child_two_pick) | list) | random }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.night_child_one_animation
      data:
        option: '{{ child_one_pick }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.night_child_two_animation
      data:
        option: '{{ child_two_pick }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.night_child_three_animation
      data:
        option: '{{ child_three_pick }}'
