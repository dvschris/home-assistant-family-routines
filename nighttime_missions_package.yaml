input_text:
  night_missions_night_key:
    name: Night missions — latest night reset date
    max: 12
  night_missions_week_key:
    name: Night missions — active week
    max: 12
automation:
- id: night_missions_reset
  alias: Nighttime Missions — New night, clear tasks and randomize stars
  description: A fresh bedtime begins every day at 4 PM; restart-safe after 4 PM.
  triggers:
  - trigger: time
    at: '16:00:00'
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ now() >= today_at(''16:00'') and states(''input_text.night_missions_night_key'') != now().strftime(''%Y-%m-%d'')
      }}'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.night_child_one_bath
      - input_boolean.night_child_one_pjs
      - input_boolean.night_child_one_brush_teeth
      - input_boolean.night_child_one_go_potty
      - input_boolean.night_child_one_bedtime_bravery
      - input_boolean.night_child_two_bath
      - input_boolean.night_child_two_pjs
      - input_boolean.night_child_two_brush_teeth
      - input_boolean.night_child_two_go_potty
      - input_boolean.night_child_two_bedtime_bravery
      - input_boolean.night_child_three_bath
      - input_boolean.night_child_three_pjs
      - input_boolean.night_child_three_brush_teeth
      - input_boolean.night_child_three_go_potty
      - input_boolean.night_child_three_bedtime_bravery
  - action: script.night_missions_reroll_animations
  - action: input_text.set_value
    target:
      entity_id: input_text.night_missions_night_key
    data:
      value: '{{ now().strftime(''%Y-%m-%d'') }}'
  mode: single
- id: night_missions_weekly_reset
  alias: Nighttime Missions — Weekly reset
  description: Clear the earned day-star flags on Mondays at midnight; restart-safe.
  triggers:
  - trigger: time
    at: 00:00:00
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ states(''input_text.night_missions_week_key'') != now().strftime(''%G-W%V'') }}'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.night_child_one_star_mon
      - input_boolean.night_child_one_star_tue
      - input_boolean.night_child_one_star_wed
      - input_boolean.night_child_one_star_thu
      - input_boolean.night_child_one_star_fri
      - input_boolean.night_child_one_star_sat
      - input_boolean.night_child_one_star_sun
      - input_boolean.night_child_two_star_mon
      - input_boolean.night_child_two_star_tue
      - input_boolean.night_child_two_star_wed
      - input_boolean.night_child_two_star_thu
      - input_boolean.night_child_two_star_fri
      - input_boolean.night_child_two_star_sat
      - input_boolean.night_child_two_star_sun
      - input_boolean.night_child_three_star_mon
      - input_boolean.night_child_three_star_tue
      - input_boolean.night_child_three_star_wed
      - input_boolean.night_child_three_star_thu
      - input_boolean.night_child_three_star_fri
      - input_boolean.night_child_three_star_sat
      - input_boolean.night_child_three_star_sun
  - action: input_text.set_value
    target:
      entity_id: input_text.night_missions_week_key
    data:
      value: '{{ now().strftime(''%G-W%V'') }}'
  mode: single
- id: night_missions_award_child_one
  alias: Nighttime Missions — Award Child One bedtime star
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.night_child_one_bath
    - input_boolean.night_child_one_pjs
    - input_boolean.night_child_one_brush_teeth
    - input_boolean.night_child_one_go_potty
    - input_boolean.night_child_one_bedtime_bravery
    to: 'on'
  conditions:
  - condition: template
    value_template: |-
      {{
              is_state('input_boolean.night_child_one_bath', 'on') and
              is_state('input_boolean.night_child_one_pjs', 'on') and
              is_state('input_boolean.night_child_one_brush_teeth', 'on') and
              is_state('input_boolean.night_child_one_go_potty', 'on') and
              is_state('input_boolean.night_child_one_bedtime_bravery', 'on')
              and now() >= today_at('16:00')
              and is_state('input_boolean.night_child_one_star_' ~ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()], 'off')
            }}
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: '{{ ''input_boolean.night_child_one_star_'' ~ [''mon'',''tue'',''wed'',''thu'',''fri'',''sat'',''sun''][now().weekday()]
        }}'
  mode: single
- id: night_missions_award_child_two
  alias: Nighttime Missions — Award Child Two bedtime star
  triggers:
