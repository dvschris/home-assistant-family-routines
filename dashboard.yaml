                    <div class="mission-stars">${starLine}</div>
                  </div>
                  <style>
                    .mission{font-family:system-ui,sans-serif;color:white;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-sizing:border-box}
                    .mission-head{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:22px;line-height:1.1;letter-spacing:.6px}
