                        ${p(5,`<rect x="95" y="17" width="70" height="38" rx="10" fill="#b3d5ee"/><rect x="107" y="27" width="46" height="17" rx="5" fill="#344660"/><circle cx="117" cy="35" r="4" fill="#7de6de"/><circle cx="143" cy="35" r="4" fill="#7de6de"/><path d="M130 17V6" stroke="#bddaf0" stroke-width="4"/><circle cx="130" cy="6" r="5" fill="#fbd068"/>`)}
