                      const wings = `<g class="${done?'dragon-far-wing':''}" style="transform-origin:132px 93px"><path d="M132 96Q115 57 139 44Q151 59 154 85L145 77L144 92Z" fill="#5a9fb0" stroke="#285b6b" stroke-width="2"/></g><g class="${done?'dragon-near-wing':''}" style="transform-origin:126px 93px"><path d="M129 98Q99 92 87 56Q114 51 140 80L132 78L129 88L119 84Z" fill="#71d9c5" stroke="#285b6b" stroke-width="2.5"/><path d="M126 91L96 61L113 83M96 61L130 79" fill="none" stroke="#b2f3d4" stroke-width="2.4" stroke-linecap="round"/></g>`;
                      const dragon = `<g class="${done?'dragon-flight':''}"><path d="M116 113Q87 140 66 113Q85 126 99 99Z" fill="#53bca9" stroke="#285b6b" stroke-width="2.5"/><path d="M78 121L79 112L87 122L90 114L97 117" fill="#f6d58c" stroke="#285b6b" stroke-width="1.5"/><path d="M113 98Q127 86 143 87L157 101Q159 119 143 126L117 123Q105 114 113 98Z" fill="#64d4bb" stroke="#285b6b" stroke-width="2.5"/><ellipse cx="137" cy="110" rx="13" ry="15" fill="#f7dc98" transform="rotate(-20 137 110)"/><path d="M125 122l-3 10h-9M147 122l4 8h9" fill="none" stroke="#285b6b" stroke-width="5" stroke-linecap="round"/><path d="M145 92L150 107L164 111" fill="none" stroke="#4aad9c" stroke-width="7" stroke-linecap="round"/>${face}${count>=5?wings:''}</g>`;
                      art = `<g opacity="${done?'.65':'.28'}" fill="#dcefff"><path d="M18 45q0-7 7-7q4-12 15-6q10-2 13 9q6 1 6 6H18Z"/><path d="M200 57q0-8 9-9q3-10 13-7q10-3 14 7q9 0 10 9Z"/></g><ellipse cx="130" cy="143" rx="57" ry="6" fill="#10283d" opacity=".25"/>
                        ${count<3?`<g class="${count>=1?'dragon-egg-wiggle':''}">${egg}${count>=2?'<path d="M133 52L125 72L139 83L123 98L135 117" fill="none" stroke="#594273" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>':''}</g>`:''}
                        ${count===3?`<g transform="translate(-27 13)">${face}</g>${shell}<path d="M109 71Q117 47 131 43Q145 47 153 68L141 64L130 74L119 65Z" fill="#bda6ee" stroke="#70549e" stroke-width="3" transform="rotate(-18 110 70)"/>`:''}
                        ${count>=4?dragon:''}${count===4?shell:''}
