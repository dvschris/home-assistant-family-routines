                        ${p(2,`<rect x="100" y="95" width="19" height="26" rx="3" fill="#b1c6dd"/><rect x="141" y="95" width="19" height="26" rx="3" fill="#b1c6dd"/>`)}
                        ${p(3,`<rect x="96" y="57" width="68" height="47" rx="8" fill="${accent}"/><circle cx="130" cy="80" r="13" fill="#d7f7ff"/><path d="M123 81l5 5 11-12" stroke="#338579" stroke-width="3" fill="none"/>`)}
                        ${p(4,`<path d="M96 69H73v24M164 69h23v24" stroke="#b2c6dc" stroke-width="13" fill="none" stroke-linecap="round"/><circle cx="73" cy="97" r="8" fill="#f5d26b"/><circle cx="187" cy="97" r="8" fill="#f5d26b"/>`)}
                        ${p(5,`<rect x="95" y="17" width="70" height="38" rx="10" fill="#b3d5ee"/><rect x="107" y="27" width="46" height="17" rx="5" fill="#344660"/><circle cx="117" cy="35" r="4" fill="#7de6de"/><circle cx="143" cy="35" r="4" fill="#7de6de"/><path d="M130 17V6" stroke="#bddaf0" stroke-width="4"/><circle cx="130" cy="6" r="5" fill="#fbd068"/>`)}
                        ${p(6,`<path d="M124 41q6 7 12 0" stroke="#7de6de" stroke-width="2" fill="none"/>`)}
                      </g>`;
                    break;
                  default:
                    title = 'MORNING MISSION';
                    stages = ['GET STARTED','ONE DOWN','TWO DOWN','HALFWAY','FOUR DOWN','ALMOST DONE','COMPLETE!'];
                    art = `<circle cx="130" cy="77" r="47" fill="${accent}" opacity=".85"/><text x="130" y="91" text-anchor="middle" font-size="45" fill="#fff">${count}</text>`;
                }
                const starLine = days.map((day,i) =>
                  `<span class="star ${won[i]?'earned':''}" title="${day}">${won[i]?'★':'☆'}<small>${['M','T','W','T','F','S','S'][i]}</small></span>`
                ).join('');
                return `
                  <div class="mission">
                    <div class="mission-head"><strong>${display}</strong><span>${stars}/7 STARS</span></div>
                    <div class="mission-theme">${title} · ${count}/6</div>
                    <svg class="mission-art" viewBox="0 0 260 157" role="img" aria-label="${title} progress">
                      ${art}
                      ${sparks}
                    </svg>
                    <div class="mission-footer"><span>${stages[count]}</span>${done?`<strong>${earnedToday?'★ STAR EARNED!':'ALL DONE!'}</strong>`:''}</div>
                    <div class="mission-stars">${starLine}</div>
                  </div>
                  <style>
                    .mission{font-family:system-ui,sans-serif;color:white;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-sizing:border-box}
                    .mission-head{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:22px;line-height:1.1;letter-spacing:.6px}
                    .mission-head span{font-size:12px;font-weight:800;color:#c6d8ed;letter-spacing:0}
                    .mission-theme{font-size:11px;font-weight:800;letter-spacing:1.1px;color:#d9e7f7;margin-top:3px}
                    .mission-art{width:100%;min-height:0;flex:1;overflow:visible;max-height:158px}
                    .mission-footer{width:100%;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:850;color:#dceafa;letter-spacing:.5px;min-height:16px}
                    .mission-footer strong{color:#ffe078;font-size:11px}
                    .mission-stars{width:100%;display:flex;justify-content:space-around;margin-top:3px}
                    .star{display:flex;flex-direction:column;align-items:center;font-size:22px;line-height:21px;color:#63728a}
                    .star.earned{color:#ffce47}
                    .star small{font-size:9px;line-height:11px;color:#d7deec;font-weight:750}
                    .launch{animation:takeoff 4.5s ease-in-out infinite;transform-origin:130px 110px}
                    @keyframes takeoff{0%,12%{transform:translateY(0);opacity:1}48%{transform:translateY(-145px);opacity:1}60%,72%{transform:translateY(-145px);opacity:0}73%{transform:translateY(0);opacity:0}88%,100%{transform:translateY(0);opacity:1}}
                    .drive{animation:drive 3.4s ease-in-out infinite}
                    @keyframes drive{0%,15%{transform:translateX(0)}65%{transform:translateX(43px)}85%,100%{transform:translateX(0)}}
                    .steam-forward{animation:steamAdvance 3.5s linear infinite}
                    @keyframes steamAdvance{0%,10%{transform:translateX(0);opacity:1}80%{transform:translateX(45px);opacity:1}83%{transform:translateX(45px);opacity:0}84%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}
                    .trex-walk{animation:trexStride 1.35s ease-in-out infinite;transform-origin:130px 110px}
                    .trex-leg-left{transform-origin:110px 109px;animation:legSwing .65s ease-in-out infinite alternate}
                    .trex-leg-right{transform-origin:148px 109px;animation:legSwing .65s ease-in-out infinite alternate-reverse}
                    @keyframes legSwing{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
                    @keyframes trexStride{0%{transform:translate(0,0)}25%{transform:translate(7px,-3px)}50%{transform:translate(14px,0)}75%{transform:translate(21px,-3px)}100%{transform:translate(28px,0)}}
                    .land{animation:land 3.5s ease-in-out infinite}
                    @keyframes land{0%{transform:translateY(-36px)}40%,100%{transform:translateY(0)}}
                    .dive{animation:dive 3.8s ease-in-out infinite}
                    @keyframes dive{0%,20%{transform:translateY(-6px)}65%{transform:translateY(22px)}100%{transform:translateY(-6px)}}
                    .paper-glide{animation:paperGlide 3.2s ease-in-out infinite;transform-origin:132px 94px}
                    @keyframes paperGlide{0%,100%{transform:translateY(5px) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
                    .dance{animation:dance .65s ease-in-out infinite alternate;transform-origin:130px 125px}
                    @keyframes dance{from{transform:rotate(-6deg) translateY(0)}to{transform:rotate(6deg) translateY(-8px)}}
                    .stomp{animation:stomp .5s ease-in-out infinite alternate;transform-origin:130px 135px}
                    @keyframes stomp{from{transform:translateY(0)}to{transform:translateY(-6px)}}
                    .castle-horse-prance{animation:horsePrance 1s ease-in-out infinite alternate;transform-box:view-box;transform-origin:115px 127px}
                    @keyframes horsePrance{0%{transform:translateY(1px) rotate(-3deg)}100%{transform:translateY(-6px) rotate(3deg)}}
                    .butterfly-flight{animation:butterflyFloat 2.2s ease-in-out infinite alternate;transform-box:view-box;transform-origin:131px 95px}
                    @keyframes butterflyFloat{0%{transform:translateY(4px)}100%{transform:translateY(-5px)}}
                    .butterfly-wing-left,.butterfly-wing-right{transform-box:view-box;transform-origin:131px 89px}
                    .butterfly-wing-left{animation:butterflyFlap .85s ease-in-out infinite alternate}
                    .butterfly-wing-right{animation:butterflyFlap .85s ease-in-out infinite alternate}
                    @keyframes butterflyFlap{from{transform:scaleX(.35)}to{transform:scaleX(1)}}
                    .butterfly-stars>*{animation:butterflyBlink 1.2s ease-in-out infinite alternate}
                    .butterfly-stars>*:nth-child(2n){animation-delay:.55s}
                    .butterfly-stars>*:nth-child(3n){animation-delay:.85s}
                    @keyframes butterflyBlink{from{opacity:.15;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
                    .bloom{animation:bloom 1s cubic-bezier(.2,1.3,.4,1) both;transform-origin:130px 98px}
                    @keyframes bloom{from{opacity:.4;scale:.65}to{opacity:1;scale:1}}
                    .drops{animation:drops 1.5s ease-in infinite}
                    @keyframes drops{0%{transform:translateY(-12px);opacity:0}60%{opacity:1}100%{transform:translateY(14px);opacity:0}}
                    .sparkles{animation:shine .9s ease-in-out infinite alternate}
                    @keyframes shine{from{opacity:.2}to{opacity:1}}
                    .flame{animation:shine .3s ease-in-out infinite alternate}
                    .wiggle{animation:wiggle 1.2s ease-in-out infinite alternate;transform-origin:130px 124px}
                    @keyframes wiggle{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
                    .smoke,.bubbles{animation:drops 2s ease-in-out infinite reverse}
                  </style>`;
              ]]]
          name: Rainbow
          update_timer: 1s
        - type: entities
          title: Rainbow · Step 0–6
          show_header_toggle: false
