                const theme = states['input_select.morning_missions_child_two_theme']?.state || 'rocket';
                const days = ['mon','tue','wed','thu','fri','sat','sun'];
                const won = [
                  states['input_boolean.child_two_star_mon'],
                  states['input_boolean.child_two_star_tue'],
