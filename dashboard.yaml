                        ${p(2,`<path d="M112 54Q115 33 130 15Q145 33 148 54Z" fill="#fa687e"/>`)}
                        ${p(3,`<circle cx="130" cy="73" r="13" fill="#65bff1" stroke="#fff" stroke-width="4"/><circle cx="126" cy="68" r="4" fill="#def9ff"/>`)}
                        ${p(4,`<path d="M112 93L94 120L112 114ZM148 93L166 120L148 114Z" fill="#fa687e"/>`)}
                        ${p(5,`<path d="M118 115H142L138 122H122Z" fill="#718aa4"/>`)}
                        ${p(6,`<g class="flame"><path d="M119 121Q119 146 130 155Q141 146 141 121Z" fill="#ff9f39"/><path d="M125 122Q125 139 130 145Q135 139 135 122Z" fill="#ffe67b"/></g>`)}
                      </g>`;
                    break;
                  case 'flower':
                    title = 'FLOWER GARDEN';
                    stages = ['BARE SOIL','PLANT A SEED','WATER IT','A SPROUT','LEAVES','A BUD','FLOWER BLOOMS!'];
                    art = `
                      <ellipse cx="130" cy="131" rx="84" ry="12" fill="#9a6a40"/>
                      <path d="M53 131Q130 112 207 131" stroke="#bc8859" stroke-width="6" fill="none"/>
                      ${p(1,`<ellipse cx="130" cy="122" rx="10" ry="6" fill="#dfbd78" transform="rotate(-20 130 122)"/>`)}
                      ${p(2,`<g class="drops" fill="#6fd6ff"><path d="M101 48q-11 18 0 23q11-5 0-23ZM127 35q-11 18 0 23q11-5 0-23ZM152 52q-11 18 0 23q11-5 0-23Z"/></g>`)}
                      ${p(3,`<path d="M130 128Q124 101 130 84" fill="none" stroke="#4fbd79" stroke-width="6" stroke-linecap="round"/>`)}
                      ${p(4,`<ellipse cx="112" cy="101" rx="19" ry="9" fill="#75d28c" transform="rotate(23 112 101)"/><ellipse cx="147" cy="85" rx="19" ry="9" fill="#58c279" transform="rotate(-28 147 85)"/>`)}
                      ${p(5,`<path d="M130 83V56" stroke="#4fbd79" stroke-width="6"/><ellipse cx="130" cy="51" rx="13" ry="16" fill="#7ab95a"/>`)}
                      ${p(6,`<g class="bloom" transform="translate(130 48)">${Array.from({length:8},(_,i)=>`<ellipse cx="0" cy="-18" rx="11" ry="18" fill="${accent}" transform="rotate(${i*45})" stroke="#fff" stroke-opacity=".25"/>`).join('')}<circle r="15" fill="#ffe178"/><circle cx="-5" cy="-1" r="2.2" fill="#65472d"/><circle cx="5" cy="-1" r="2.2" fill="#65472d"/><path d="M-5 6q5 7 10 0" fill="none" stroke="#65472d" stroke-width="2"/></g>`)}
                    `;
                    break;
                  case 'car':
