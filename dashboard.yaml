                          count === 5 ? leaf() + cocoon(true) + emergingButterfly :
                          flyingButterfly;
                    break;
                  case 'rainbow':
                    title = 'MAKE A RAINBOW';
                    stages = ['CLOUDY SKY','CLOUDS','RAINDROPS','SUN PEEKS','SUN SHINES','COLOR APPEARS','RAINBOW!'];
                    art = `
                      ${p(1,`<g fill="#d3e5f3"><circle cx="85" cy="63" r="22"/><circle cx="109" cy="55" r="27"/><circle cx="137" cy="63" r="22"/><rect x="68" y="64" width="88" height="19" rx="9"/></g>`)}
                      ${p(2,`<g class="drops" stroke="#77c8ee" stroke-width="5" stroke-linecap="round"><path d="M86 97l-4 12m23-12l-4 12m23-12l-4 12m23-12l-4 12"/></g>`)}
                      ${p(3,`<circle cx="179" cy="42" r="21" fill="#ffdd66"/>`)}
                      ${p(4,`<g stroke="#ffe68d" stroke-width="4" stroke-linecap="round"><path d="M179 10v8m0 48v8m-32-32h8m48 0h8m-56-24l6 6m36 36l6 6m0-48l-6 6m-36 36l-6 6"/></g>`)}
                      ${p(5,`<path d="M42 131A88 88 0 0 1 218 131" fill="none" stroke="#ef747f" stroke-width="12"/><path d="M54 131A76 76 0 0 1 206 131" fill="none" stroke="#ffcc58" stroke-width="12"/>`)}
                      ${p(6,`<g class="bloom"><path d="M66 131A64 64 0 0 1 194 131" fill="none" stroke="#68d17a" stroke-width="12"/><path d="M78 131A52 52 0 0 1 182 131" fill="none" stroke="#64afe7" stroke-width="12"/><path d="M90 131A40 40 0 0 1 170 131" fill="none" stroke="#a791ec" stroke-width="12"/></g>`)}
                    `;
                    break;
                  case 'robot':
                    title = 'BUILD A ROBOT';
                    stages = ['WORKSHOP','ROBOT FEET','LEGS','BODY','ARMS','ROBOT HEAD','HAPPY DANCE!'];
                    art = `
                      <path d="M42 136h176" stroke="#7c91a1" stroke-width="7" stroke-linecap="round"/>
