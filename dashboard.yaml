                      ${p(2,`<g class="drops" stroke="#77c8ee" stroke-width="5" stroke-linecap="round"><path d="M86 97l-4 12m23-12l-4 12m23-12l-4 12m23-12l-4 12"/></g>`)}
                      ${p(3,`<circle cx="179" cy="42" r="21" fill="#ffdd66"/>`)}
                      ${p(4,`<g stroke="#ffe68d" stroke-width="4" stroke-linecap="round"><path d="M179 10v8m0 48v8m-32-32h8m48 0h8m-56-24l6 6m36 36l6 6m0-48l-6 6m-36 36l-6 6"/></g>`)}
                      ${p(5,`<path d="M42 131A88 88 0 0 1 218 131" fill="none" stroke="#ef747f" stroke-width="12"/><path d="M54 131A76 76 0 0 1 206 131" fill="none" stroke="#ffcc58" stroke-width="12"/>`)}
                      ${p(6,`<g class="bloom"><path d="M66 131A64 64 0 0 1 194 131" fill="none" stroke="#68d17a" stroke-width="12"/><path d="M78 131A52 52 0 0 1 182 131" fill="none" stroke="#64afe7" stroke-width="12"/><path d="M90 131A40 40 0 0 1 170 131" fill="none" stroke="#a791ec" stroke-width="12"/></g>`)}
                    `;
                    break;
                  case 'robot':
                    title = 'BUILD A ROBOT';
                    stages = ['WORKSHOP','ROBOT FEET','LEGS','BODY','ARMS','ROBOT HEAD','HAPPY DANCE!'];
                    art = `
                      <path d="M42 136h176" stroke="#7c91a1" stroke-width="7" stroke-linecap="round"/>
                      <g class="${done?'dance':''}">
                        ${p(1,`<rect x="88" y="119" width="37" height="13" rx="5" fill="#7899bc"/><rect x="135" y="119" width="37" height="13" rx="5" fill="#7899bc"/>`)}
                        ${p(2,`<rect x="100" y="95" width="19" height="26" rx="3" fill="#b1c6dd"/><rect x="141" y="95" width="19" height="26" rx="3" fill="#b1c6dd"/>`)}
                        ${p(3,`<rect x="96" y="57" width="68" height="47" rx="8" fill="${accent}"/><circle cx="130" cy="80" r="13" fill="#d7f7ff"/><path d="M123 81l5 5 11-12" stroke="#338579" stroke-width="3" fill="none"/>`)}
                        ${p(4,`<path d="M96 69H73v24M164 69h23v24" stroke="#b2c6dc" stroke-width="13" fill="none" stroke-linecap="round"/><circle cx="73" cy="97" r="8" fill="#f5d26b"/><circle cx="187" cy="97" r="8" fill="#f5d26b"/>`)}
                        ${p(5,`<rect x="95" y="17" width="70" height="38" rx="10" fill="#b3d5ee"/><rect x="107" y="27" width="46" height="17" rx="5" fill="#344660"/><circle cx="117" cy="35" r="4" fill="#7de6de"/><circle cx="143" cy="35" r="4" fill="#7de6de"/><path d="M130 17V6" stroke="#bddaf0" stroke-width="4"/><circle cx="130" cy="6" r="5" fill="#fbd068"/>`)}
                        ${p(6,`<path d="M124 41q6 7 12 0" stroke="#7de6de" stroke-width="2" fill="none"/>`)}
                      </g>`;
                    break;
                  default:
                    title = 'MORNING MISSION';
                    stages = ['GET STARTED','ONE DOWN','TWO DOWN','HALFWAY','FOUR DOWN','ALMOST DONE','COMPLETE!'];
                    art = `<circle cx="130" cy="77" r="47" fill="${accent}" opacity=".85"/><text x="130" y="91" text-anchor="middle" font-size="45" fill="#fff">${count}</text>`;
                }
                const starLine = days.map((day,i) =>
                  `<span class="star ${won[i]?'earned':''}" title="${day}">${won[i]?'★':'☆'}<small>${['M','T','W','T','F','S','S'][i]}</small></span>`
                ).join('');
                return `
                  <div class="mission">
                    <div class="mission-head"><strong>${display}</strong><span>${stars}/7 STARS</span></div>
                    <div class="mission-theme">${title} · ${count}/6</div>
                    <svg class="mission-art" viewBox="0 0 260 157" role="img" aria-label="${title} progress">
                      ${art}
                      ${sparks}
                    </svg>
                    <div class="mission-footer"><span>${stages[count]}</span>${done?`<strong>${earnedToday?'★ STAR EARNED!':'ALL DONE!'}</strong>`:''}</div>
                    <div class="mission-stars">${starLine}</div>
                  </div>
                  <style>
                    .mission{font-family:system-ui,sans-serif;color:white;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-sizing:border-box}
                    .mission-head{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:22px;line-height:1.1;letter-spacing:.6px}
                    .mission-head span{font-size:12px;font-weight:800;color:#c6d8ed;letter-spacing:0}
                    .mission-theme{font-size:11px;font-weight:800;letter-spacing:1.1px;color:#d9e7f7;margin-top:3px}
                    .mission-art{width:100%;min-height:0;flex:1;overflow:visible;max-height:158px}
                    .mission-footer{width:100%;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:850;color:#dceafa;letter-spacing:.5px;min-height:16px}
                    .mission-footer strong{color:#ffe078;font-size:11px}
                    .mission-stars{width:100%;display:flex;justify-content:space-around;margin-top:3px}
                    .star{display:flex;flex-direction:column;align-items:center;font-size:22px;line-height:21px;color:#63728a}
                    .star.earned{color:#ffce47}
                    .star small{font-size:9px;line-height:11px;color:#d7deec;font-weight:750}
                    .launch{animation:takeoff 4.5s ease-in-out infinite;transform-origin:130px 110px}
                    @keyframes takeoff{0%,12%{transform:translateY(0);opacity:1}48%{transform:translateY(-145px);opacity:1}60%,72%{transform:translateY(-145px);opacity:0}73%{transform:translateY(0);opacity:0}88%,100%{transform:translateY(0);opacity:1}}
                    .drive{animation:drive 3.4s ease-in-out infinite}
                    @keyframes drive{0%,15%{transform:translateX(0)}65%{transform:translateX(43px)}85%,100%{transform:translateX(0)}}
                    .steam-forward{animation:steamAdvance 3.5s linear infinite}
                    @keyframes steamAdvance{0%,10%{transform:translateX(0);opacity:1}80%{transform:translateX(45px);opacity:1}83%{transform:translateX(45px);opacity:0}84%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}
                    .trex-walk{animation:trexStride 1.35s ease-in-out infinite;transform-origin:130px 110px}
                    .trex-leg-left{transform-origin:110px 109px;animation:legSwing .65s ease-in-out infinite alternate}
                    .trex-leg-right{transform-origin:148px 109px;animation:legSwing .65s ease-in-out infinite alternate-reverse}
                    @keyframes legSwing{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
                    @keyframes trexStride{0%{transform:translate(0,0)}25%{transform:translate(7px,-3px)}50%{transform:translate(14px,0)}75%{transform:translate(21px,-3px)}100%{transform:translate(28px,0)}}
                    .land{animation:land 3.5s ease-in-out infinite}
                    @keyframes land{0%{transform:translateY(-36px)}40%,100%{transform:translateY(0)}}
                    .dive{animation:dive 3.8s ease-in-out infinite}
                    @keyframes dive{0%,20%{transform:translateY(-6px)}65%{transform:translateY(22px)}100%{transform:translateY(-6px)}}
                    .paper-glide{animation:paperGlide 3.2s ease-in-out infinite;transform-origin:132px 94px}
                    @keyframes paperGlide{0%,100%{transform:translateY(5px) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
                    .dance{animation:dance .65s ease-in-out infinite alternate;transform-origin:130px 125px}
                    @keyframes dance{from{transform:rotate(-6deg) translateY(0)}to{transform:rotate(6deg) translateY(-8px)}}
                    .stomp{animation:stomp .5s ease-in-out infinite alternate;transform-origin:130px 135px}
                    @keyframes stomp{from{transform:translateY(0)}to{transform:translateY(-6px)}}
                    .castle-horse-prance{animation:horsePrance 1s ease-in-out infinite alternate;transform-box:view-box;transform-origin:115px 127px}
                    @keyframes horsePrance{0%{transform:translateY(1px) rotate(-3deg)}100%{transform:translateY(-6px) rotate(3deg)}}
                    .butterfly-flight{animation:butterflyFloat 2.2s ease-in-out infinite alternate;transform-box:view-box;transform-origin:131px 95px}
                    @keyframes butterflyFloat{0%{transform:translateY(4px)}100%{transform:translateY(-5px)}}
                    .butterfly-wing-left,.butterfly-wing-right{transform-box:view-box;transform-origin:131px 89px}
                    .butterfly-wing-left{animation:butterflyFlap .85s ease-in-out infinite alternate}
                    .butterfly-wing-right{animation:butterflyFlap .85s ease-in-out infinite alternate}
                    @keyframes butterflyFlap{from{transform:scaleX(.35)}to{transform:scaleX(1)}}
                    .butterfly-stars>*{animation:butterflyBlink 1.2s ease-in-out infinite alternate}
                    .butterfly-stars>*:nth-child(2n){animation-delay:.55s}
                    .butterfly-stars>*:nth-child(3n){animation-delay:.85s}
                    @keyframes butterflyBlink{from{opacity:.15;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
                    .bloom{animation:bloom 1s cubic-bezier(.2,1.3,.4,1) both;transform-origin:130px 98px}
                    @keyframes bloom{from{opacity:.4;scale:.65}to{opacity:1;scale:1}}
                    .drops{animation:drops 1.5s ease-in infinite}
                    @keyframes drops{0%{transform:translateY(-12px);opacity:0}60%{opacity:1}100%{transform:translateY(14px);opacity:0}}
                    .sparkles{animation:shine .9s ease-in-out infinite alternate}
                    @keyframes shine{from{opacity:.2}to{opacity:1}}
                    .flame{animation:shine .3s ease-in-out infinite alternate}
                    .wiggle{animation:wiggle 1.2s ease-in-out infinite alternate;transform-origin:130px 124px}
                    @keyframes wiggle{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
                    .smoke,.bubbles{animation:drops 2s ease-in-out infinite reverse}
                    .dragon-egg-wiggle{transform-origin:130px 130px;animation:dragonEggWiggle 1.5s ease-in-out infinite}
                    @keyframes dragonEggWiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}90%{transform:rotate(-3deg)}}
                    .dragon-flight{animation:dragonFlight 4.8s ease-in-out infinite;transform-origin:130px 96px}
                    @keyframes dragonFlight{0%,100%{transform:translate(-30px,-18px) rotate(-5deg)}25%{transform:translate(-5px,-39px) rotate(-10deg)}50%{transform:translate(30px,-23px) rotate(5deg)}75%{transform:translate(0,-9px) rotate(7deg)}}
                    .dragon-near-wing{animation:dragonWingFlap .48s ease-in-out infinite alternate;transform-box:view-box}
                    .dragon-far-wing{animation:dragonFarWingFlap .48s ease-in-out infinite alternate;transform-box:view-box}
                    @keyframes dragonWingFlap{from{transform:rotate(-12deg) scaleY(1)}to{transform:rotate(20deg) scaleY(.28)}}
                    @keyframes dragonFarWingFlap{from{transform:rotate(10deg) scaleY(.35)}to{transform:rotate(-15deg) scaleY(1)}}
                  </style>`;
              ]]]
          name: Hatching Dragon
          update_timer: 1s
        - type: entities
          title: Hatching Dragon · Step 0–6
          show_header_toggle: false
          entities:
          - entity: input_number.morning_preview_dragon_step
            name: Animation stage
  subview: true
- title: Nighttime Missions
  path: nighttime-missions
  icon: mdi:star-crescent
  type: panel
  cards:
  - type: grid
    columns: 3
    square: false
    cards:
    - type: vertical-stack
      cards:
      - type: custom:button-card
        entity: input_select.night_child_one_animation
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: none
        custom_fields:
          hero: |-
            [[[
              const kid='child_one';
              const count=[
                states['input_boolean.night_child_one_bath'],
                states['input_boolean.night_child_one_pjs'],
                states['input_boolean.night_child_one_brush_teeth'],
                states['input_boolean.night_child_one_go_potty'],
                states['input_boolean.night_child_one_bedtime_bravery']
              ].filter(s => s?.state === 'on').length;
              const animation=states['input_select.night_child_one_animation']?.state || 'bounce';
              const earned=[
                states['input_boolean.night_child_one_star_mon'],
                states['input_boolean.night_child_one_star_tue'],
                states['input_boolean.night_child_one_star_wed'],
                states['input_boolean.night_child_one_star_thu'],
                states['input_boolean.night_child_one_star_fri'],
                states['input_boolean.night_child_one_star_sat'],
                states['input_boolean.night_child_one_star_sun']
              ].map(s=>s?.state === 'on');
              const earnedToday=earned[(new Date().getDay()+6)%7];
              const nStars=earned.filter(Boolean).length;
              const completed=count===5;
              const starPath="M 156.0 28.4 L 182.0 73.5 Q 184.0 77.0 188.0 77.6 L 233.1 84.2 Q 245.0 86.0 238.0 95.8 L 209.3 135.7 Q 207.0 139.0 207.6 143.0 L 215.2 194.1 Q 217.0 206.0 206.2 200.8 L 153.6 175.7 Q 150.0 174.0 146.4 175.7 L 93.8 200.8 Q 83.0 206.0 84.8 194.1 L 92.4 143.0 Q 93.0 139.0 90.7 135.7 L 62.0 95.8 Q 55.0 86.0 66.9 84.2 L 112.0 77.6 Q 116.0 77.0 118.0 73.5 L 144.0 28.4 Q 150.0 18.0 156.0 28.4 Z";
              const facets=["150,119 116,77 150,18 184,77", "150,119 184,77 245,86 207,139", "150,119 207,139 217,206 150,174", "150,119 150,174 83,206 93,139", "150,119 93,139 55,86 116,77"];
              const arms=facets.map((points,i)=>`
                <polygon points="${points}" fill="${i<count?`url(#nm-gold-${kid})`:`url(#nm-empty-${kid})`}"
                   stroke="#ffffff" stroke-opacity=".13" stroke-width=".9"/>
              `).join('');
              const days=['M','T','W','T','F','S','S'];
              const week=days.map((d,i)=>`<span class="week-star ${earned[i]?'won':''}">${earned[i]?'★':'☆'}<small>${d}</small></span>`).join('');
              const effect={
                bounce:'Happy bounce',twirl:'Star twirl',wiggle:'Silly wiggle',float:'Dreamy float',
                dance:'Disco dance',cartwheel:'Cartwheel',heartbeat:'Happy heartbeat',orbit:'Little orbit',
                jump:'Big jump',swing:'Playful swing',disco:'Disco lights',rocket:'Rocket boost',
                skate:'Star skating',shooting:'Shooting star'
              }[animation] || 'Happy bounce';
              const decor=completed?`<g class="sparkles" fill="#fff5aa"><path d="M40 40l5 11 11 5-11 5-5 11-5-11-11-5 11-5Z"/><path d="M260 58l5 12 12 5-12 5-5 12-5-12-12-5 12-5Z"/><circle cx="42" cy="177" r="5"/><circle cx="257" cy="169" r="4"/></g>`:'';
              return `
                <div class="night-mission">
                  <div class="nm-header"><strong>FINN</strong><span>${nStars}/7 STARS</span></div>
                  <div class="nm-subtitle">${count}/5 TASKS · ${effect.toUpperCase()}</div>
                  <svg class="nm-art" viewBox="0 0 300 250" role="img" aria-label="Five-point star ${count} of 5 complete">
                    <defs>
                              <linearGradient id="nm-gold-child_one" x1="0.04" y1="0.02" x2="0.96" y2="0.98">
                                <stop offset="0%" stop-color="#fff0a0"/>
                                <stop offset="36%" stop-color="#ffdf48"/>
                                <stop offset="70%" stop-color="#ffd014"/>
                                <stop offset="100%" stop-color="#f7b800"/>
                              </linearGradient>
                              <linearGradient id="nm-empty-child_one" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#8998ae"/>
                                <stop offset="100%" stop-color="#5b6a80"/>
                              </linearGradient>
                              <linearGradient id="nm-gloss-child_one" x1="0" y1="0" x2=".9" y2="1">
                                <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
                                <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
                              </linearGradient>
                              <linearGradient id="nm-side-child_one" x1="0" y1="0" x2=".25" y2="1">
                                <stop offset="0" stop-color="#ffe058"/>
                                <stop offset=".45" stop-color="#cf890a"/>
                                <stop offset="1" stop-color="#a56513"/>
                              </linearGradient>
                              <clipPath id="nm-clip-child_one"><path d="${starPath}"/></clipPath>
                              <filter id="nm-shadow-child_one" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
                            </defs>
                    <ellipse cx="150" cy="226" rx="78" ry="11" fill="#061320" opacity=".45" filter="url(#nm-shadow-child_one)"/>
                    <g class="star-motion ${completed?'playing '+animation:''}">
                                <!-- Deep extrusion makes the star read as a solid toy -->
                                <path d="${starPath}" transform="translate(0 14)" fill="#8b5014" stroke="#7a4a13" stroke-width="8" stroke-linejoin="round"/>
                                <path d="${starPath}" transform="translate(0 8)" fill="url(#nm-side-child_one)" stroke="#c8840f" stroke-width="6" stroke-linejoin="round"/>
                                <!-- Gold rim remains visible even while points are incomplete -->
                                <path d="${starPath}" fill="#718096" stroke="#ffca14" stroke-width="10" stroke-linejoin="round"/>
                                <g clip-path="url(#nm-clip-child_one)">
                                  ${arms}
                                  <!-- Broad soft highlight across the upper-left face -->
                                  <path d="M74 84 Q120 41 181 75 Q208 92 220 99 Q180 89 145 107 Q115 117 82 107 Z" fill="url(#nm-gloss-child_one)" opacity=".26"/>
                                  <path d="M100 100 Q129 86 160 97" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="5" stroke-linecap="round"/>
                                </g>
                                <!-- Thin golden specular line above the thick extruded edge -->
                                <path d="${starPath}" fill="none" stroke="#ffe45c" stroke-width="4" stroke-linejoin="round"/>
                                <path d="M110 81 Q129 44 150 28" fill="none" stroke="#fff6a9" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
                                <circle cx="140" cy="126" r="3.2" fill="#775018"/><circle cx="160" cy="126" r="3.2" fill="#775018"/>
                                <path d="${completed?'M136 140 Q150 151 164 140':'M141 139 Q150 143 159 139'}" fill="none" stroke="#775018" stroke-width="3" stroke-linecap="round"/>
                              </g>
                    ${decor}
                    ${completed&&animation==='rocket'?'<g class="nm-flames"><path d="M136 210 Q150 246 164 210Z" fill="#ff9d46"/><path d="M142 210 Q150 230 158 210Z" fill="#fff39b"/></g>':''}
                    ${completed&&animation==='shooting'?'<g class="nm-streaks" stroke="#fff6b2" stroke-width="4" stroke-linecap="round"><path d="M33 155L77 146"/><path d="M19 174L69 161"/><path d="M37 195L85 170"/></g>':''}
                    ${completed&&animation==='disco'?'<g class="nm-rays" stroke="#ffa2e7" stroke-width="3"><path d="M35 85L17 68"/><path d="M265 87L286 68"/><path d="M41 186L20 200"/><path d="M259 186L281 202"/></g>':''}
                  </svg>
                  <div class="nm-status">${completed?(earnedToday?'★ NIGHTTIME STAR EARNED!':'ALL DONE — GREAT WORK!'):`${count} OF 5 STAR POINTS FILLED`}</div>
                  <div class="nm-week">${week}</div>
                </div>
                <style>
                  .night-mission{display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:100%;height:100%;font-family:system-ui,sans-serif;color:#fff;box-sizing:border-box}
                  .nm-header{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:21px;letter-spacing:.6px}
                  .nm-header span{font-size:12px;font-weight:800;color:#d2d5ff;letter-spacing:0}
                  .nm-subtitle{font-size:10px;letter-spacing:1px;color:#d7d8ff;font-weight:800;margin:4px 0}
                  .nm-art{width:100%;height:200px;flex:1;min-height:0;overflow:visible}
                  .nm-status{font-size:12px;font-weight:850;min-height:18px;text-align:center;color:${completed?'#ffe383':'#cbd5e1'};letter-spacing:.5px}
                  .nm-week{width:100%;display:flex;justify-content:space-around;margin-top:7px}
                  .week-star{color:#72819b;font-size:25px;line-height:23px;display:flex;align-items:center;flex-direction:column}
                  .week-star.won{color:#ffcf53}
                  .week-star small{color:#d2d8ed;font-size:9px;line-height:14px;font-weight:800}
                  .star-motion{transform-origin:150px 130px;transform-box:view-box}
                  .star-motion.playing.bounce{animation:nm-bounce 1.1s ease-in-out infinite}
                  .star-motion.playing.twirl{animation:nm-twirl 3.2s linear infinite}
                  .star-motion.playing.wiggle{animation:nm-wiggle .48s ease-in-out infinite alternate}
                  .star-motion.playing.float{animation:nm-float 2.8s ease-in-out infinite}
                  .star-motion.playing.dance{animation:nm-dance 1.25s ease-in-out infinite}
                  .star-motion.playing.cartwheel{animation:nm-cartwheel 2.8s ease-in-out infinite}
                  .star-motion.playing.heartbeat{animation:nm-beat 1.5s ease-in-out infinite}
                  .star-motion.playing.orbit{animation:nm-orbit 2.7s linear infinite}
                  .star-motion.playing.jump{animation:nm-jump 1.6s ease-in-out infinite}
                  .star-motion.playing.swing{animation:nm-swing 2.2s ease-in-out infinite}
                  .star-motion.playing.disco{animation:nm-disco .85s ease-in-out infinite alternate}
                  .star-motion.playing.rocket{animation:nm-rocket 2.4s ease-in-out infinite}
                  .star-motion.playing.skate{animation:nm-skate 2.1s ease-in-out infinite}
                  .star-motion.playing.shooting{animation:nm-shoot 2.6s ease-in-out infinite}
                  @keyframes nm-bounce{0%,100%{transform:translateY(0) scale(1,1)}48%{transform:translateY(-22px) scale(.94,1.06)}70%{transform:translateY(0) scale(1.06,.94)}}
                  @keyframes nm-twirl{to{transform:rotate(360deg)}}
                  @keyframes nm-wiggle{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
                  @keyframes nm-float{0%,100%{transform:translateY(4px) rotate(-3deg)}50%{transform:translateY(-23px) rotate(4deg)}}
                  @keyframes nm-dance{0%,100%{transform:translate(-12px,0) rotate(-12deg)}25%{transform:translate(0,-16px) rotate(8deg)}50%{transform:translate(12px,0) rotate(12deg)}75%{transform:translate(0,-15px) rotate(-8deg)}}
                  @keyframes nm-cartwheel{0%{transform:translateX(-17px) rotate(-360deg)}100%{transform:translateX(17px) rotate(0deg)}}
                  @keyframes nm-beat{0%,100%{transform:scale(1)}18%{transform:scale(1.14)}30%{transform:scale(.98)}43%{transform:scale(1.1)}60%{transform:scale(1)}}
                  @keyframes nm-orbit{0%{transform:translate(16px,0)}25%{transform:translate(0,-16px)}50%{transform:translate(-16px,0)}75%{transform:translate(0,16px)}100%{transform:translate(16px,0)}}
                  @keyframes nm-jump{0%,100%{transform:translateY(0) scale(1.05,.95)}45%{transform:translateY(-48px) scale(.92,1.08)}65%{transform:translateY(-45px)}}
                  @keyframes nm-swing{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
                  @keyframes nm-disco{from{transform:rotate(-12deg) scale(.96)}to{transform:rotate(12deg) scale(1.08)}}
