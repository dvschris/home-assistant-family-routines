                    <div class="timer-caption"><span>LEAVE FOR SCHOOL</span><strong>${clock}</strong><span>7:28 AM</span></div>
                    <svg class="road" viewBox="0 0 1000 175" aria-label="Bus progresses toward school as time runs out">
