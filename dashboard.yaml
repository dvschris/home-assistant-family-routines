                        <path d="M119 121L112 101M141 121L148 101" stroke="#eacb88" stroke-width="1.8" fill="none"/>
                      `)}
                      ${count === 5 ? `
                        <!-- Little knight standing in the open doorway -->
                        <g class="castle-door-knight">
                          <path d="M125 112V123M135 112V123" stroke="#9aaac0" stroke-width="3" stroke-linecap="round"/>
                          <path d="M123 105H137L138 116H122Z" fill="#c9d8e6" stroke="#6e879e" stroke-width="1.5"/>
                          <circle cx="130" cy="99" r="7" fill="#e7eef3" stroke="#6f889e" stroke-width="1.3"/>
