                const sparks = done && theme !== 'paper_airplane' && theme !== 'butterfly' ? `<g class="sparkles" fill="#ffe275"><path d="M34 35l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/><path d="M223 31l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/></g>` : '';
