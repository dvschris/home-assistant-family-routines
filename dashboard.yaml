            main: |
              [[[
                const child = 'child_two';
                const display = 'ARBOR';
                const accent = '#8fb9ff';
                // Literal entity references guarantee Button Card v7 tracks all dependencies.
                const count = [
                  states['input_boolean.child_two_brush_teeth'],
