                  - width: 42px
                  - color: '#ff7d84'
                  name:
                  - font-size: 15px
                  - font-weight: '800'
                  - color: white
        timer: |-
          [[[
                const now = new Date();
                // Independent browser-clock visibility; no conditional card wrapper.
                const weekday = now.getDay() >= 1 && now.getDay() <= 5;
                const minuteOfDay = now.getHours() * 60 + now.getMinutes();
                const dismissed = states['input_boolean.morning_missions_bus_dismissed']?.state === 'on';
                if (!weekday || minuteOfDay < 6 * 60 + 45 || minuteOfDay >= 7 * 60 + 40 || dismissed) {
                  return '';
                }
                const end = new Date(now);
                end.setHours(7,28,0,0);
                const total = 43 * 60;
                const remaining = Math.max(0, Math.ceil((end - now)/1000));
                const traveled = Math.max(0, Math.min(1, (total - remaining)/total));
                const clock = `${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;
                const color = remaining === 0 ? '#f04f57' :
                  remaining <= 180 ? '#fb8b37' :
                  now.getHours()*60 + now.getMinutes() >= 7*60+17 ? '#f4cc4d' : '#49c989';
                const x0=79, x1=857, roadY=92;
                const busX=x0+(x1-x0)*traveled;
                const label = remaining === 0 ? `<span class="warning late">TIME TO GO!</span>` :
                  remaining <= 180 ? `<span class="warning">FINISH UP!</span>` :
                  '<span class="placeholder">&nbsp;</span>';
                return `
                  <div class="route">
                    <div class="timer-caption"><span>LEAVE FOR SCHOOL</span><strong>${clock}</strong><span>7:28 AM</span></div>
