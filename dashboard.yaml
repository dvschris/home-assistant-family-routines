                const count = Math.max(0, Math.min(6, Number(states['input_number.morning_preview_submarine_step']?.state ?? 0)));
                const theme = 'submarine';
                const days = ['mon','tue','wed','thu','fri','sat','sun'];
                const won = [false,false,false,false,false,false,false];
                const stars = 0;
                const earnedToday = false;
                const done = count === 6;
                const p = (step, svg) => count >= step ? svg : '';
                const sparks = done && theme !== 'paper_airplane' && theme !== 'butterfly' ? `<g class="sparkles" fill="#ffe275"><path d="M34 35l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/><path d="M223 31l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/></g>` : '';
                let art = '';
                let stages = [];
                let title = '';
                switch (theme) {
                  case 'rocket':
                    title = 'ROCKET MISSION';
                    stages = ['READY TO BUILD','BODY','NOSE CONE','WINDOW','FINS','ENGINE','LIFTOFF!'];
                    art = `
                      <ellipse cx="130" cy="138" rx="85" ry="9" fill="#ffffff" opacity=".1"/>
                      <path d="M103 127H157" stroke="#8295b5" stroke-width="8" stroke-linecap="round"/>
                      <g class="${done?'launch':''}">
                        ${p(1,`<path d="M112 54H148V111Q130 123 112 111Z" fill="#d5eafb" stroke="#6f9fce" stroke-width="2"/>`)}
                        ${p(2,`<path d="M112 54Q115 33 130 15Q145 33 148 54Z" fill="#fa687e"/>`)}
                        ${p(3,`<circle cx="130" cy="73" r="13" fill="#65bff1" stroke="#fff" stroke-width="4"/><circle cx="126" cy="68" r="4" fill="#def9ff"/>`)}
                        ${p(4,`<path d="M112 93L94 120L112 114ZM148 93L166 120L148 114Z" fill="#fa687e"/>`)}
                        ${p(5,`<path d="M118 115H142L138 122H122Z" fill="#718aa4"/>`)}
                        ${p(6,`<g class="flame"><path d="M119 121Q119 146 130 155Q141 146 141 121Z" fill="#ff9f39"/><path d="M125 122Q125 139 130 145Q135 139 135 122Z" fill="#ffe67b"/></g>`)}
                      </g>`;
                    break;
                  case 'flower':
                    title = 'FLOWER GARDEN';
                    stages = ['BARE SOIL','PLANT A SEED','WATER IT','A SPROUT','LEAVES','A BUD','FLOWER BLOOMS!'];
                    art = `
                      <ellipse cx="130" cy="131" rx="84" ry="12" fill="#9a6a40"/>
                      <path d="M53 131Q130 112 207 131" stroke="#bc8859" stroke-width="6" fill="none"/>
                      ${p(1,`<ellipse cx="130" cy="122" rx="10" ry="6" fill="#dfbd78" transform="rotate(-20 130 122)"/>`)}
                      ${p(2,`<g class="drops" fill="#6fd6ff"><path d="M101 48q-11 18 0 23q11-5 0-23ZM127 35q-11 18 0 23q11-5 0-23ZM152 52q-11 18 0 23q11-5 0-23Z"/></g>`)}
                      ${p(3,`<path d="M130 128Q124 101 130 84" fill="none" stroke="#4fbd79" stroke-width="6" stroke-linecap="round"/>`)}
                      ${p(4,`<ellipse cx="112" cy="101" rx="19" ry="9" fill="#75d28c" transform="rotate(23 112 101)"/><ellipse cx="147" cy="85" rx="19" ry="9" fill="#58c279" transform="rotate(-28 147 85)"/>`)}
                      ${p(5,`<path d="M130 83V56" stroke="#4fbd79" stroke-width="6"/><ellipse cx="130" cy="51" rx="13" ry="16" fill="#7ab95a"/>`)}
                      ${p(6,`<g class="bloom" transform="translate(130 48)">${Array.from({length:8},(_,i)=>`<ellipse cx="0" cy="-18" rx="11" ry="18" fill="${accent}" transform="rotate(${i*45})" stroke="#fff" stroke-opacity=".25"/>`).join('')}<circle r="15" fill="#ffe178"/><circle cx="-5" cy="-1" r="2.2" fill="#65472d"/><circle cx="5" cy="-1" r="2.2" fill="#65472d"/><path d="M-5 6q5 7 10 0" fill="none" stroke="#65472d" stroke-width="2"/></g>`)}
                    `;
                    break;
                  case 'car':
                    title = 'BUILD A CAR';
                    stages = ['GARAGE OPEN','CHASSIS','WHEELS','BODY','WINDOWS','HEADLIGHTS','ROAD TRIP!'];
                    art = `
                      <path d="M28 129H232" stroke="#748395" stroke-width="7" stroke-linecap="round" stroke-dasharray="24 10"/>
                      <g class="${done?'drive':''}">
                        ${p(1,`<rect x="71" y="93" width="120" height="17" rx="7" fill="#a5aebe"/>`)}
                        ${p(2,`<circle cx="98" cy="115" r="15" fill="#222a34"/><circle cx="164" cy="115" r="15" fill="#222a34"/><circle cx="98" cy="115" r="6" fill="#a9bdcf"/><circle cx="164" cy="115" r="6" fill="#a9bdcf"/>`)}
                        ${p(3,`<path d="M68 91L88 66H161L193 91V104H68Z" fill="${accent}" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>`)}
                        ${p(4,`<path d="M91 70H119V89H75ZM125 70H157L181 89H125Z" fill="#a9e4fc"/><path d="M122 69V92" stroke="#334a62" stroke-width="3"/>`)}
                        ${p(5,`<rect x="68" y="94" width="10" height="7" rx="2" fill="#ffda6d"/><rect x="182" y="94" width="10" height="7" rx="2" fill="#ffda6d"/>`)}
                        ${p(6,`<g fill="#fff5bc" class="sparkles"><path d="M208 74l8 8-8 8M221 78l6 6-6 6" fill="none" stroke="#ffe48c" stroke-width="3"/></g>`)}
                      </g>`;
                    break;
                  case 'train':
                    title = 'STEAM TRAIN';
                    stages = ['ALL ABOARD','RAILROAD TRACK','STEAM BOILER','CAB + WHEELS','COAL TENDER','SMOKESTACK','FULL STEAM AHEAD!'];
                    art = `
                      <path d="M12 137H248M12 147H248" stroke="#a7b1bf" stroke-width="4"/>
                      <path d="M20 134v16m26-16v16m26-16v16m26-16v16m26-16v16m26-16v16m26-16v16m26-16v16m26-16v16" stroke="#715b54" stroke-width="5"/>
                      <g class="${done?'steam-forward':''}">
                        ${p(2,`<rect x="86" y="78" width="102" height="40" rx="19" fill="#364b62" stroke="#d7b574" stroke-width="3"/><path d="M92 105H185" stroke="${accent}" stroke-width="5"/><circle cx="174" cy="98" r="7" fill="#e2b95c"/>`)}
