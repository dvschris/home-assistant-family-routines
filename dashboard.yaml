                        ${p(5,`<path d="M168 82L180 98L194 95M162 91L174 107L188 105" stroke="#41966a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M187 91l8 2m-7 9l7 2" stroke="#b4eeae" stroke-width="3"/>`)}
                        ${p(6,`<circle cx="205" cy="42" r="5.5" fill="white"/><circle cx="207" cy="43" r="2.8" fill="#263d38"/><circle cx="226" cy="44" r="2.4" fill="#3f8c6d"/><path d="M155 58l-8-8m-10 6l-8-8m-10 8l-8-7" stroke="#4c9c71" stroke-width="4" stroke-linecap="round"/><path d="M205 75q6 4 13 0" stroke="#3e8a60" stroke-width="2" fill="none"/>`)}
