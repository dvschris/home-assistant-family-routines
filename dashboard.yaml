              const earnedToday=earned[(new Date().getDay()+6)%7];
              const nStars=earned.filter(Boolean).length;
              const completed=count===5;
              const starPath="M 156.0 28.4 L 182.0 73.5 Q 184.0 77.0 188.0 77.6 L 233.1 84.2 Q 245.0 86.0 238.0 95.8 L 209.3 135.7 Q 207.0 139.0 207.6 143.0 L 215.2 194.1 Q 217.0 206.0 206.2 200.8 L 153.6 175.7 Q 150.0 174.0 146.4 175.7 L 93.8 200.8 Q 83.0 206.0 84.8 194.1 L 92.4 143.0 Q 93.0 139.0 90.7 135.7 L 62.0 95.8 Q 55.0 86.0 66.9 84.2 L 112.0 77.6 Q 116.0 77.0 118.0 73.5 L 144.0 28.4 Q 150.0 18.0 156.0 28.4 Z";
              const facets=["150,119 116,77 150,18 184,77", "150,119 184,77 245,86 207,139", "150,119 207,139 217,206 150,174", "150,119 150,174 83,206 93,139", "150,119 93,139 55,86 116,77"];
              const arms=facets.map((points,i)=>`
                <polygon points="${points}" fill="${i<count?`url(#nm-gold-${kid})`:`url(#nm-empty-${kid})`}"
                   stroke="#ffffff" stroke-opacity=".13" stroke-width=".9"/>
