views:
- title: Morning Missions
  path: morning-missions
  icon: mdi:rocket-launch
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: grid
      columns: 3
      square: false
      cards:
      - type: vertical-stack
        cards:
        - type: custom:button-card
          entity: input_select.morning_missions_child_one_theme
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: none
          styles:
            card:
            - height: 200px
            - border-radius: 18px
            - background: '#172b4d'
            - border: none
            - box-shadow: none
            - padding: 10px 14px
            - overflow: hidden
            grid:
            - grid-template-areas: '"main"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr
            custom_fields:
              main:
              - height: 100%
              - width: 100%
          custom_fields:
            main: |
              [[[
                const child = 'child_one';
                const display = 'FINN';
                const accent = '#ff9886';
                // Literal entity references guarantee Button Card v7 tracks all dependencies.
                const count = [
                  states['input_boolean.child_one_brush_teeth'],
                  states['input_boolean.child_one_eat_breakfast'],
                  states['input_boolean.child_one_get_dressed'],
                  states['input_boolean.child_one_socks_shoes'],
                  states['input_boolean.child_one_brush_hair'],
                  states['input_boolean.child_one_go_potty']
                ].filter(s => s?.state === 'on').length;
                const theme = states['input_select.morning_missions_child_one_theme']?.state || 'rocket';
                const days = ['mon','tue','wed','thu','fri','sat','sun'];
                const won = [
                  states['input_boolean.child_one_star_mon'],
                  states['input_boolean.child_one_star_tue'],
                  states['input_boolean.child_one_star_wed'],
                  states['input_boolean.child_one_star_thu'],
                  states['input_boolean.child_one_star_fri'],
                  states['input_boolean.child_one_star_sat'],
                  states['input_boolean.child_one_star_sun']
                ].map(s => s?.state === 'on');
                const stars = won.filter(Boolean).length;
                const earnedToday = won[(new Date().getDay()+6)%7];
                const done = count === 6;
                const p = (step, svg) => count >= step ? svg : '';
                const sparks = done && theme !== 'paper_airplane' && theme !== 'butterfly' ? `<g class="sparkles" fill="#ffe275"><path d="M34 35l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/><path d="M223 31l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/></g>` : '';
                let art = '';
                let stages = [];
                let title = '';
                switch (theme) {
                    case 'dragon': {
                      title = 'HATCH A DRAGON';
                      stages = ['A MYSTERY EGG','A LITTLE WIGGLE','THE FIRST CRACK','PEEKABOO!','A BABY DRAGON','SPREAD YOUR WINGS','TAKE FLIGHT!'];
                      const egg = `<path d="M98 118C89 99 103 49 130 42C157 49 171 99 162 118C151 137 109 137 98 118Z" fill="#bda6ee" stroke="#70549e" stroke-width="3"/><path d="M105 103C102 79 117 54 125 51" fill="none" stroke="#e5d9ff" stroke-width="7" stroke-linecap="round"/><g fill="#8a73bc" opacity=".7"><ellipse cx="145" cy="70" rx="6" ry="9" transform="rotate(-25 145 70)"/><ellipse cx="113" cy="115" rx="5" ry="7"/><ellipse cx="147" cy="106" rx="8" ry="5"/></g>`;
                      const shell = `<path d="M97 105L108 111L120 101L133 114L145 102L162 107Q166 136 130 138Q98 137 97 105Z" fill="#bda6ee" stroke="#70549e" stroke-width="3"/><path d="M103 115Q107 131 123 132" fill="none" stroke="#e5d9ff" stroke-width="5" stroke-linecap="round"/>`;
                      const face = `<path d="M147 72L149 56L158 68M165 73L175 62L173 81" fill="#f6d58c" stroke="#3d6e79" stroke-width="2"/><path d="M140 78Q145 65 160 68Q177 70 179 84L190 89Q195 98 182 102L164 103Q145 100 140 87Z" fill="#64d4bb" stroke="#285b6b" stroke-width="2.5"/><ellipse cx="165" cy="82" rx="5" ry="7" fill="white"/><ellipse cx="167" cy="82" rx="2.6" ry="4.4" fill="#16374d"/><circle cx="168" cy="80" r="1" fill="white"/><circle cx="184" cy="92" r="1.6" fill="#285b6b"/><path d="M175 97Q180 100 185 97" fill="none" stroke="#285b6b" stroke-width="2" stroke-linecap="round"/>`;
                      const wings = `<g class="${done?'dragon-far-wing':''}" style="transform-origin:132px 93px"><path d="M132 96Q115 57 139 44Q151 59 154 85L145 77L144 92Z" fill="#5a9fb0" stroke="#285b6b" stroke-width="2"/></g><g class="${done?'dragon-near-wing':''}" style="transform-origin:126px 93px"><path d="M129 98Q99 92 87 56Q114 51 140 80L132 78L129 88L119 84Z" fill="#71d9c5" stroke="#285b6b" stroke-width="2.5"/><path d="M126 91L96 61L113 83M96 61L130 79" fill="none" stroke="#b2f3d4" stroke-width="2.4" stroke-linecap="round"/></g>`;
                      const dragon = `<g class="${done?'dragon-flight':''}"><path d="M116 113Q87 140 66 113Q85 126 99 99Z" fill="#53bca9" stroke="#285b6b" stroke-width="2.5"/><path d="M78 121L79 112L87 122L90 114L97 117" fill="#f6d58c" stroke="#285b6b" stroke-width="1.5"/><path d="M113 98Q127 86 143 87L157 101Q159 119 143 126L117 123Q105 114 113 98Z" fill="#64d4bb" stroke="#285b6b" stroke-width="2.5"/><ellipse cx="137" cy="110" rx="13" ry="15" fill="#f7dc98" transform="rotate(-20 137 110)"/><path d="M125 122l-3 10h-9M147 122l4 8h9" fill="none" stroke="#285b6b" stroke-width="5" stroke-linecap="round"/><path d="M145 92L150 107L164 111" fill="none" stroke="#4aad9c" stroke-width="7" stroke-linecap="round"/>${face}${count>=5?wings:''}</g>`;
                      art = `<g opacity="${done?'.65':'.28'}" fill="#dcefff"><path d="M18 45q0-7 7-7q4-12 15-6q10-2 13 9q6 1 6 6H18Z"/><path d="M200 57q0-8 9-9q3-10 13-7q10-3 14 7q9 0 10 9Z"/></g><ellipse cx="130" cy="143" rx="57" ry="6" fill="#10283d" opacity=".25"/>
                        ${count<3?`<g class="${count>=1?'dragon-egg-wiggle':''}">${egg}${count>=2?'<path d="M133 52L125 72L139 83L123 98L135 117" fill="none" stroke="#594273" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>':''}</g>`:''}
                        ${count===3?`<g transform="translate(-27 13)">${face}</g>${shell}<path d="M109 71Q117 47 131 43Q145 47 153 68L141 64L130 74L119 65Z" fill="#bda6ee" stroke="#70549e" stroke-width="3" transform="rotate(-18 110 70)"/>`:''}
                        ${count>=4?dragon:''}${count===4?shell:''}
                        ${count>=5?'<path d="M77 138l11-8 11 11ZM166 140l10-11 11 8Z" fill="#bda6ee" stroke="#70549e" stroke-width="2"/>':''}`;
                      break;
                    }
                  case 'rocket':
                    title = 'ROCKET MISSION';
                    stages = ['READY TO BUILD','BODY','NOSE CONE','WINDOW','FINS','ENGINE','LIFTOFF!'];
                    art = `
                      <ellipse cx="130" cy="138" rx="85" ry="9" fill="#ffffff" opacity=".1"/>
                      <path d="M103 127H157" stroke="#8295b5" stroke-width="8" stroke-linecap="round"/>
                      <g class="${done?'launch':''}">
                        ${p(1,`<path d="M112 54H148V111Q130 123 112 111Z" fill="#d5eafb" stroke="#6f9fce" stroke-width="2"/>`)}
                        ${p(2,`<path d="M112 54Q115 33 130 15Q145 33 148 54Z" fill="#fa687e"/>`)}
                        ${p(3,`<circle cx="130" cy="73" r="13" fill="#65bff1" stroke="#fff" stroke-width="4"/><circle cx="126" cy="68" r="4" fill="#def9ff"/>`)}
                        ${p(4,`<path d="M112 93L94 120L112 114ZM148 93L166 120L148 114Z" fill="#fa687e"/>`)}
                        ${p(5,`<path d="M118 115H142L138 122H122Z" fill="#718aa4"/>`)}
                        ${p(6,`<g class="flame"><path d="M119 121Q119 146 130 155Q141 146 141 121Z" fill="#ff9f39"/><path d="M125 122Q125 139 130 145Q135 139 135 122Z" fill="#ffe67b"/></g>`)}
                      </g>`;
                    break;
                  case 'flower':
                    title = 'FLOWER GARDEN';
                    stages = ['BARE SOIL','PLANT A SEED','WATER IT','A SPROUT','LEAVES','A BUD','FLOWER BLOOMS!'];
                    art = `
                      <ellipse cx="130" cy="131" rx="84" ry="12" fill="#9a6a40"/>
                      <path d="M53 131Q130 112 207 131" stroke="#bc8859" stroke-width="6" fill="none"/>
                      ${p(1,`<ellipse cx="130" cy="122" rx="10" ry="6" fill="#dfbd78" transform="rotate(-20 130 122)"/>`)}
                      ${p(2,`<g class="drops" fill="#6fd6ff"><path d="M101 48q-11 18 0 23q11-5 0-23ZM127 35q-11 18 0 23q11-5 0-23ZM152 52q-11 18 0 23q11-5 0-23Z"/></g>`)}
                      ${p(3,`<path d="M130 128Q124 101 130 84" fill="none" stroke="#4fbd79" stroke-width="6" stroke-linecap="round"/>`)}
                      ${p(4,`<ellipse cx="112" cy="101" rx="19" ry="9" fill="#75d28c" transform="rotate(23 112 101)"/><ellipse cx="147" cy="85" rx="19" ry="9" fill="#58c279" transform="rotate(-28 147 85)"/>`)}
                      ${p(5,`<path d="M130 83V56" stroke="#4fbd79" stroke-width="6"/><ellipse cx="130" cy="51" rx="13" ry="16" fill="#7ab95a"/>`)}
                      ${p(6,`<g class="bloom" transform="translate(130 48)">${Array.from({length:8},(_,i)=>`<ellipse cx="0" cy="-18" rx="11" ry="18" fill="${accent}" transform="rotate(${i*45})" stroke="#fff" stroke-opacity=".25"/>`).join('')}<circle r="15" fill="#ffe178"/><circle cx="-5" cy="-1" r="2.2" fill="#65472d"/><circle cx="5" cy="-1" r="2.2" fill="#65472d"/><path d="M-5 6q5 7 10 0" fill="none" stroke="#65472d" stroke-width="2"/></g>`)}
                    `;
                    break;
                  case 'car':
                    title = 'BUILD A CAR';
                    stages = ['GARAGE OPEN','CHASSIS','WHEELS','BODY','WINDOWS','HEADLIGHTS','ROAD TRIP!'];
                    art = `
                      <path d="M28 129H232" stroke="#748395" stroke-width="7" stroke-linecap="round" stroke-dasharray="24 10"/>
                      <g class="${done?'drive':''}">
                        ${p(1,`<rect x="71" y="93" width="120" height="17" rx="7" fill="#a5aebe"/>`)}
                        ${p(2,`<circle cx="98" cy="115" r="15" fill="#222a34"/><circle cx="164" cy="115" r="15" fill="#222a34"/><circle cx="98" cy="115" r="6" fill="#a9bdcf"/><circle cx="164" cy="115" r="6" fill="#a9bdcf"/>`)}
                        ${p(3,`<path d="M68 91L88 66H161L193 91V104H68Z" fill="${accent}" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>`)}
                        ${p(4,`<path d="M91 70H119V89H75ZM125 70H157L181 89H125Z" fill="#a9e4fc"/><path d="M122 69V92" stroke="#334a62" stroke-width="3"/>`)}
                        ${p(5,`<rect x="68" y="94" width="10" height="7" rx="2" fill="#ffda6d"/><rect x="182" y="94" width="10" height="7" rx="2" fill="#ffda6d"/>`)}
                        ${p(6,`<g fill="#fff5bc" class="sparkles"><path d="M208 74l8 8-8 8M221 78l6 6-6 6" fill="none" stroke="#ffe48c" stroke-width="3"/></g>`)}
                      </g>`;
                    break;
                  case 'train':
                    title = 'STEAM TRAIN';
                    stages = ['ALL ABOARD','RAILROAD TRACK','STEAM BOILER','CAB + WHEELS','COAL TENDER','SMOKESTACK','FULL STEAM AHEAD!'];
                    art = `
                      <path d="M12 137H248M12 147H248" stroke="#a7b1bf" stroke-width="4"/>
                      <path d="M20 134v16m26-16v16m26-16v16m26-16v16m26-16v16m26-16v16m26-16v16m26-16v16m26-16v16" stroke="#715b54" stroke-width="5"/>
                      <g class="${done?'steam-forward':''}">
                        ${p(2,`<rect x="86" y="78" width="102" height="40" rx="19" fill="#364b62" stroke="#d7b574" stroke-width="3"/><path d="M92 105H185" stroke="${accent}" stroke-width="5"/><circle cx="174" cy="98" r="7" fill="#e2b95c"/>`)}
                        ${p(3,`<rect x="50" y="59" width="45" height="60" rx="4" fill="${accent}" stroke="#ffe1a6" stroke-width="2"/><path d="M46 59H98L91 51H54Z" fill="#2e3e53"/><rect x="62" y="68" width="21" height="22" rx="2" fill="#a8e2f7"/><rect x="48" y="110" width="145" height="10" rx="3" fill="#334154"/><circle cx="91" cy="127" r="13" fill="#242b39" stroke="#d6a75c" stroke-width="4"/><circle cx="141" cy="127" r="13" fill="#242b39" stroke="#d6a75c" stroke-width="4"/><circle cx="181" cy="127" r="10" fill="#242b39" stroke="#d6a75c" stroke-width="3"/><path d="M91 127H181" stroke="#ead2a2" stroke-width="3"/>`)}
                        ${p(4,`<rect x="10" y="90" width="36" height="28" rx="3" fill="#9d6246" stroke="#deac6b" stroke-width="2"/><path d="M9 90L14 81H43L48 90" fill="#242b39"/><circle cx="20" cy="127" r="9" fill="#242b39" stroke="#d6a75c" stroke-width="3"/><circle cx="39" cy="127" r="9" fill="#242b39" stroke="#d6a75c" stroke-width="3"/><path d="M46 113H50" stroke="#c4a36e" stroke-width="4"/>`)}
                        ${p(5,`<rect x="153" y="52" width="18" height="30" rx="3" fill="#2c3643"/><path d="M149 52H176L172 45H153Z" fill="#333b49"/><g class="smoke" fill="#e4ecf2" opacity=".9"><circle cx="162" cy="35" r="8"/><circle cx="176" cy="24" r="10"/><circle cx="192" cy="14" r="11"/></g><path d="M189 109L218 119L189 119Z" fill="#bd4c48" stroke="#f0c36b" stroke-width="2"/>`)}
                        ${p(6,`<circle cx="185" cy="96" r="4" fill="#fff5b5"/><path d="M84 102h65" stroke="#e8c889" stroke-width="2"/><g class="steam-puff" fill="#eff8ff" opacity=".7"><circle cx="185" cy="20" r="7"/><circle cx="200" cy="14" r="9"/></g>`)}
                      </g>`;
                    break;
                  case 'moon':
                    title = 'MOON LANDING';
                    stages = ['MISSION CONTROL','STARS','LANDER','SOLAR PANELS','LANDING LEGS','DESCENT','MOON LANDING!'];
                    art = `
                      <path d="M0 140Q130 109 260 140V160H0Z" fill="#a6a7b2"/><circle cx="65" cy="137" r="13" fill="#888d9d"/><circle cx="209" cy="144" r="9" fill="#888d9d"/>
                      ${p(1,`<g fill="#f6eab9"><circle cx="42" cy="30" r="3"/><circle cx="211" cy="21" r="2.5"/><path d="M179 41l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/></g>`)}
                      <g class="${done?'land':''}">
                        ${p(2,`<path d="M111 57H149L158 94H102Z" fill="#c4d9e8" stroke="#e8f8ff" stroke-width="2"/><path d="M111 57L130 36L149 57Z" fill="#f1c66b"/>`)}
                        ${p(3,`<rect x="66" y="65" width="34" height="24" fill="#5e92d4"/><rect x="160" y="65" width="34" height="24" fill="#5e92d4"/><path d="M80 65v24m7-24v24m89-24v24m7-24v24" stroke="#b7dbff" stroke-width="2"/><path d="M100 77h6m48 0h6" stroke="#e6d6a2" stroke-width="3"/>`)}
                        ${p(4,`<path d="M105 93L92 117H82M155 93L168 117H178" stroke="#f1d792" stroke-width="5" fill="none"/><path d="M95 118H77M165 118H183" stroke="#e7d8bc" stroke-width="5"/>`)}
                        ${p(5,`<path d="M116 92Q130 113 144 92Z" fill="#ffa74a" class="flame"/>`)}
                        ${p(6,`<path d="M114 115h32" stroke="#e4c67c" stroke-width="5" stroke-linecap="round"/><circle cx="130" cy="73" r="10" fill="#89cbee"/><path d="M123 72l5 4 9-10" stroke="#fff" stroke-width="2" fill="none"/>`)}
                      </g>`;
                    break;
                  case 'pumpkin':
                    title = 'PUMPKIN PATCH';
                    stages = ['EMPTY PATCH','PLANT A SEED','WATER','A SPROUT','GROWING VINES','A BLOSSOM','BIG PUMPKIN!'];
                    art = `
                      <ellipse cx="130" cy="133" rx="90" ry="14" fill="#a96b3f"/>
                      ${p(1,`<ellipse cx="128" cy="124" rx="9" ry="5" fill="#d7b16c"/>`)}
                      ${p(2,`<g class="drops" fill="#6bd2ef"><path d="M100 41q-12 18 0 24q12-6 0-24ZM145 50q-12 18 0 24q12-6 0-24Z"/></g>`)}
                      ${p(3,`<path d="M128 128V101" stroke="#58b65a" stroke-width="5"/><ellipse cx="115" cy="99" rx="15" ry="8" fill="#72cd71" transform="rotate(25 115 99)"/>`)}
                      ${p(4,`<path d="M128 120Q172 103 190 125M128 120Q99 103 72 122" stroke="#4da35a" stroke-width="5" fill="none"/><ellipse cx="176" cy="110" rx="17" ry="9" fill="#6cbd61"/>`)}
                      ${p(5,`<g transform="translate(155 88)"><circle r="10" fill="#ffde5e"/><circle cx="0" cy="-13" r="8" fill="#ffe68b"/><circle cx="12" cy="3" r="8" fill="#ffe68b"/><circle cx="-12" cy="3" r="8" fill="#ffe68b"/></g>`)}
                      ${p(6,`<g class="bloom"><ellipse cx="132" cy="105" rx="38" ry="31" fill="#ef862b"/><ellipse cx="115" cy="104" rx="18" ry="30" fill="#f6a03e"/><ellipse cx="147" cy="104" rx="18" ry="30" fill="#f6a03e"/><path d="M129 74l5-16 7 5-5 14" fill="#52843f"/><circle cx="122" cy="103" r="3" fill="#61391f"/><circle cx="142" cy="103" r="3" fill="#61391f"/><path d="M123 114q9 8 18 0" stroke="#61391f" stroke-width="2" fill="none"/></g>`)}
                    `;
                    break;
                  case 'egg':
                    title = 'HATCH AN EGG';
                    stages = ['EMPTY NEST','BUILD A NEST','A LITTLE EGG','EGG WIGGLES','CRACKS APPEAR','CHICK PEEKS','HELLO, CHICK!'];
                    art = `
                      ${p(1,`<ellipse cx="130" cy="125" rx="76" ry="20" fill="#ac794e"/><path d="M65 122l23 10m-10-22l26 23m34-20l25 20m19-23l-18 22" stroke="#eac48b" stroke-width="7" stroke-linecap="round"/>`)}
                      <g class="${count>=3?'wiggle':''}">
                        ${p(2,`<path d="M130 40C94 40 86 110 106 126Q130 143 154 126C174 110 166 40 130 40Z" fill="#fff1ca" stroke="#d6bf96" stroke-width="3"/>`)}
                        ${p(3,`<path d="M106 90l14-10 11 10 13-10 15 10" stroke="#bba57c" stroke-width="3" fill="none"/>`)}
                        ${p(4,`<path d="M112 99l13-10 10 10 12-10 9 9" stroke="#947f61" stroke-width="4" fill="none"/><circle cx="123" cy="83" r="3" fill="#40414a"/><circle cx="141" cy="83" r="3" fill="#40414a"/>`)}
                        ${p(5,`<circle cx="130" cy="82" r="28" fill="#ffdf72"/><circle cx="121" cy="79" r="3" fill="#45424b"/><circle cx="141" cy="79" r="3" fill="#45424b"/><path d="M128 87l11 3-11 4Z" fill="#f78a44"/>`)}
                        ${p(6,`<g class="bloom"><circle cx="130" cy="72" r="30" fill="#ffdf72"/><ellipse cx="130" cy="113" rx="29" ry="22" fill="#ffdf72"/><circle cx="120" cy="69" r="3" fill="#3a3938"/><circle cx="141" cy="69" r="3" fill="#3a3938"/><path d="M127 78l11 4-11 5Z" fill="#f28b43"/><path d="M110 108L91 98M150 108L169 98" stroke="#ffcf63" stroke-width="10" stroke-linecap="round"/><path d="M122 132v12m15-12v12" stroke="#ec9550" stroke-width="4"/></g>`)}
                      </g>`;
                    break;
                  case 'paper_airplane':
                    title = 'PAPER AIRPLANE';
                    stages = [
                      'BLANK',
                      'RECTANGLE SHEET',
                      'FOLDED IN HALF',
                      'CORNERS TO CENTER',
                      'FOLDED IN HALF AGAIN',
                      'WINGS FOLDED DOWN',
                      'GLIDING THROUGH THE AIR!'
                    ];
                    // Each stage replaces the previous one. No layered or leftover folds.
                    // The viewBox is 260 x 157. Stage 0 intentionally draws nothing.
                    art = [
                      '',
                      // 1. A completely unfolded portrait sheet of paper.
                      `<rect x="91" y="14" width="78" height="129" rx="1.5"
                         fill="#f5fbff" stroke="#91aec7" stroke-width="2"/>
                       <path d="M95 19H165" stroke="#ffffff" stroke-width="1.5" opacity=".9"/>`,
                      // 2. Fold the paper lengthwise. Half-width, full-height rectangle.
                      `<path d="M112 14H151V143H112Z" fill="#e2eef8" stroke="#8dabca" stroke-width="2"/>
                       <path d="M114 16V141" fill="none" stroke="#ffffff" stroke-width="2"/>
                       <path d="M147 15V142" fill="none" stroke="#b4cade" stroke-width="2" stroke-dasharray="3 3"/>`,
                      // 3. Open it up and fold both top corners inward to the center crease.
                      `<rect x="91" y="14" width="78" height="129" rx="1"
                         fill="#f5fbff" stroke="#91aec7" stroke-width="2"/>
                       <path d="M130 15V142" fill="none" stroke="#a8bed3" stroke-width="1.8" stroke-dasharray="4 4"/>
                       <path d="M91 14L130 14L130 57Z" fill="#d6e9f8" stroke="#85a9c9" stroke-width="2" stroke-linejoin="round"/>
                       <path d="M169 14L130 14L130 57Z" fill="#e7f3fc" stroke="#85a9c9" stroke-width="2" stroke-linejoin="round"/>
                       <path d="M91 14L130 57L169 14" fill="none" stroke="#7398bd" stroke-width="2"/>`,
                      // 4. Fold again on the original crease; pointed nose faces up.
                      `<path d="M119 17L158 58L158 141L119 141Z"
                         fill="#edf7fe" stroke="#83a5c6" stroke-width="2.5" stroke-linejoin="round"/>
                       <path d="M119 17L119 141" fill="none" stroke="#ffffff" stroke-width="2.4"/>
                       <path d="M120 19L153 59L153 136" fill="none" stroke="#aac9e2" stroke-width="1.7"/>
                       <path d="M153 59L124 58" fill="none" stroke="#a2c0dc" stroke-width="1.3"/>`,
                      // 5. Fold both wings down. Top view makes the wing shape easy to assess.
                      `<path d="M130 15L208 131L146 109L130 140L114 109L52 131Z"
                         fill="#f5fbff" stroke="#829fb9" stroke-width="2.5" stroke-linejoin="round"/>
                       <path d="M130 15L52 131L120 105Z" fill="#d4e8f7"/>
                       <path d="M130 15L208 131L140 105Z" fill="#e5f3fd"/>
                       <path d="M130 15V140" stroke="#7f9ebc" stroke-width="2" fill="none"/>
                       <path d="M52 131L120 105M208 131L140 105" fill="none" stroke="#86abc7" stroke-width="2"/>`,
                      // 6. A side-view paper plane floats gently in place. It never reverses.
                      `<g fill="none" stroke="#b1d8f0" stroke-width="2.5"
                          stroke-linecap="round" opacity=".65">
                         <path d="M30 95Q48 87 65 92"/>
                         <path d="M22 113Q43 104 62 108"/>
                       </g>
                       <g class="paper-glide">
                         <path d="M63 92L215 61L119 102L92 124L96 103Z"
                           fill="#f4faff" stroke="#88a8c6" stroke-width="2.5" stroke-linejoin="round"/>
                         <path d="M63 92L215 61L116 94Z" fill="#cfe6f6"/>
                         <path d="M116 94L119 102L92 124L96 103Z" fill="#aacde6"/>
