                          <path d="M125 105L119 112M135 105L141 112" stroke="#b7c7d7" stroke-width="3" stroke-linecap="round"/>
                          <path d="M134 107l8 2-3 8-7-2Z" fill="#75a8d2" stroke="#e6d28d" stroke-width="1.2"/>
                        </g>` : ''}
                      ${p(6,`
                        <!-- The knight has mounted the horse and is now prancing in front -->
                        <g class="castle-horse-prance">
                          <path d="M75 115Q62 104 63 94" stroke="#65482e" stroke-width="5" fill="none" stroke-linecap="round"/>
