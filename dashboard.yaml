                      <line x1="${x0}" y1="${roadY}" x2="${busX}" y2="${roadY}" stroke="${color}" stroke-width="27" stroke-linecap="round"/>
                      <g transform="translate(927 91) scale(1.8)">
                        <rect x="-20" y="-14" width="40" height="31" rx="2" fill="#d88a43" stroke="#945a2b" stroke-width="1.5"/>
                        <path d="M-25 -14 L0 -34 L25 -14 Z" fill="#d65a58" stroke="#9c343a" stroke-width="1.5"/>
                        <rect x="-13" y="-10" width="26" height="8" rx="1" fill="#fff0bf"/>
                        <text x="0" y="-4" fill="#75482b" text-anchor="middle" font-size="6.5" font-weight="bold">SCHOOL</text>
                        <rect x="-15" y="3" width="9" height="8" fill="#93d5f5"/>
                        <rect x="6" y="3" width="9" height="8" fill="#93d5f5"/>
                        <rect x="-5" y="2" width="10" height="15" fill="#6c5038"/>
                      </g>
                      <g transform="translate(${busX} ${roadY}) scale(1.8)">
                        <rect x="-29" y="-20" width="58" height="30" rx="5" fill="#fbd34d" stroke="#a87320" stroke-width="2"/>
                        <rect x="-22" y="-15" width="12" height="12" rx="2" fill="#93d5f5"/>
                        <rect x="-7" y="-15" width="12" height="12" rx="2" fill="#93d5f5"/>
                        <rect x="8" y="-15" width="14" height="12" rx="2" fill="#93d5f5"/>
                        <rect x="-27" y="0" width="54" height="4" fill="#3c3935"/>
                        <circle cx="-17" cy="11" r="6" fill="#24262c"/><circle cx="17" cy="11" r="6" fill="#24262c"/>
                        <circle cx="-17" cy="11" r="2" fill="#bfc7d3"/><circle cx="17" cy="11" r="2" fill="#bfc7d3"/>
                      </g>
                    </svg>
                    <div class="route-message">${label}</div>
                  </div>
                  <style>
                    .route {height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:white;box-sizing:border-box;font-family:system-ui,sans-serif;}
                    .timer-caption {width:100%;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:750;color:#b8c4d1;letter-spacing:1px;}
                    .timer-caption strong {font-size:48px;font-family:monospace;font-weight:750;color:#fff;letter-spacing:1px;line-height:1;}
                    .road {width:100%;height:150px;flex:1;min-height:0;overflow:visible;}
                    .route-message {min-height:44px;text-align:center;line-height:44px;white-space:nowrap;}
                    .warning {color:${color};font-size:40px;font-weight:900;letter-spacing:1px;line-height:44px;}
                    .late {color:#ff515c;animation:flash .5s steps(1,end) infinite;}
                    @keyframes flash {0%,49%{opacity:1}50%,100%{opacity:0}}
                        .dragon-egg-wiggle{transform-origin:130px 130px;animation:dragonEggWiggle 1.5s ease-in-out infinite}
                        @keyframes dragonEggWiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}90%{transform:rotate(-3deg)}}
                        .dragon-flight{animation:dragonFlight 4.8s ease-in-out infinite;transform-origin:130px 96px}
                        @keyframes dragonFlight{0%,100%{transform:translate(-30px,-18px) rotate(-5deg)}25%{transform:translate(-5px,-39px) rotate(-10deg)}50%{transform:translate(30px,-23px) rotate(5deg)}75%{transform:translate(0,-9px) rotate(7deg)}}
                        .dragon-near-wing{animation:dragonWingFlap .48s ease-in-out infinite alternate;transform-box:view-box}
                        .dragon-far-wing{animation:dragonFarWingFlap .48s ease-in-out infinite alternate;transform-box:view-box}
                        @keyframes dragonWingFlap{from{transform:rotate(-12deg) scaleY(1)}to{transform:rotate(20deg) scaleY(.28)}}
                        @keyframes dragonFarWingFlap{from{transform:rotate(10deg) scaleY(.35)}to{transform:rotate(-15deg) scaleY(1)}}
                  </style>`;
              ]]]
      update_timer: 1s
