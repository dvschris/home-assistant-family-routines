                  .star-motion.playing.twirl{animation:nm-twirl 3.2s linear infinite}
                  .star-motion.playing.wiggle{animation:nm-wiggle .48s ease-in-out infinite alternate}
                  .star-motion.playing.float{animation:nm-float 2.8s ease-in-out infinite}
                  .star-motion.playing.dance{animation:nm-dance 1.25s ease-in-out infinite}
                  .star-motion.playing.cartwheel{animation:nm-cartwheel 2.8s ease-in-out infinite}
                  .star-motion.playing.heartbeat{animation:nm-beat 1.5s ease-in-out infinite}
                  .star-motion.playing.orbit{animation:nm-orbit 2.7s linear infinite}
                  .star-motion.playing.jump{animation:nm-jump 1.6s ease-in-out infinite}
                  .star-motion.playing.swing{animation:nm-swing 2.2s ease-in-out infinite}
                  .star-motion.playing.disco{animation:nm-disco .85s ease-in-out infinite alternate}
                  .star-motion.playing.rocket{animation:nm-rocket 2.4s ease-in-out infinite}
                  .star-motion.playing.skate{animation:nm-skate 2.1s ease-in-out infinite}
                  .star-motion.playing.shooting{animation:nm-shoot 2.6s ease-in-out infinite}
                  @keyframes nm-bounce{0%,100%{transform:translateY(0) scale(1,1)}48%{transform:translateY(-22px) scale(.94,1.06)}70%{transform:translateY(0) scale(1.06,.94)}}
                  @keyframes nm-twirl{to{transform:rotate(360deg)}}
                  @keyframes nm-wiggle{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
