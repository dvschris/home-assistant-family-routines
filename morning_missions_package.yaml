script:
  morning_missions_reroll_adventures:
    alias: Morning Missions — Reroll adventures (manual)
    description: Apply fixed animation choices; choose a fresh random adventure for Surprise without clearing tasks or stars.
    mode: single
    sequence:
    - variables:
        themes:
        - rocket
        - flower
        - car
        - train
        - moon
        - pumpkin
        - egg
        - paper_airplane
        - submarine
        - castle
        - dinosaur
        - butterfly
        - rainbow
        - robot
        - dragon
        choices: *id001
        child_one_last: '{{ states(''input_select.morning_missions_child_one_theme'') }}'
        child_two_last: '{{ states(''input_select.morning_missions_child_two_theme'') }}'
        child_three_last: '{{ states(''input_select.morning_missions_child_three_theme'') }}'
        child_one_fixed: '{{ choices.get(states(''input_select.morning_missions_child_one_animation_preference''), '''') }}'
        child_two_fixed: '{{ choices.get(states(''input_select.morning_missions_child_two_animation_preference''), '''') }}'
        child_three_fixed: '{{ choices.get(states(''input_select.morning_missions_child_three_animation_preference''), '''') }}'
    - variables:
        child_one_pick: '{{ child_one_fixed if child_one_fixed else ((themes | reject(''equalto'', child_one_last) | reject(''equalto'', child_two_fixed) | reject(''equalto'', child_three_fixed) | list) | random) }}'
    - variables:
        child_two_pick: '{{ child_two_fixed if child_two_fixed else ((themes | reject(''equalto'', child_two_last) | reject(''equalto'', child_one_fixed) | reject(''equalto'', child_three_fixed) | reject(''equalto'', child_one_pick) | list) | random) }}'
    - variables:
        child_three_pick: '{{ child_three_fixed if child_three_fixed else ((themes | reject(''equalto'', child_three_last) | reject(''equalto'', child_one_fixed) | reject(''equalto'', child_two_fixed) | reject(''equalto'', child_one_pick) | reject(''equalto'', child_two_pick) | list) | random) }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.morning_missions_child_one_theme
      data:
        option: '{{ child_one_pick }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.morning_missions_child_two_theme
      data:
        option: '{{ child_two_pick }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.morning_missions_child_three_theme
      data:
        option: '{{ child_three_pick }}'
