automation:
- id: morning_missions_daily_reset
  alias: Morning Missions — Reset daily tasks
  description: Reset all 18 tasks at 04:00 daily; keep fixed animations and reroll Surprise choices.
  triggers:
  - trigger: time
    at: 04:00:00
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ now() >= today_at(''04:00'') and states(''input_text.morning_missions_day_key'') != now().strftime(''%Y-%m-%d'') }}'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.child_one_brush_teeth
      - input_boolean.child_one_eat_breakfast
      - input_boolean.child_one_get_dressed
      - input_boolean.child_one_socks_shoes
      - input_boolean.child_two_brush_teeth
      - input_boolean.child_two_eat_breakfast
      - input_boolean.child_two_get_dressed
      - input_boolean.child_two_socks_shoes
      - input_boolean.child_three_brush_teeth
      - input_boolean.child_three_eat_breakfast
      - input_boolean.child_three_get_dressed
      - input_boolean.child_three_socks_shoes
      - input_boolean.child_one_brush_hair
      - input_boolean.child_one_go_potty
      - input_boolean.child_two_brush_hair
      - input_boolean.child_two_go_potty
      - input_boolean.child_three_brush_hair
      - input_boolean.child_three_go_potty
      - input_boolean.morning_missions_bus_dismissed
  - action: script.morning_missions_reroll_adventures
  - action: input_text.set_value
    target:
      entity_id: input_text.morning_missions_day_key
    data:
      value: '{{ now().strftime(''%Y-%m-%d'') }}'
  mode: single
- id: morning_missions_weekly_reset
  alias: Morning Missions — Reset weekly stars
  description: Clear star helpers at a new ISO week, including after Home Assistant downtime.
  triggers:
  - trigger: time
    at: 03:59:00
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ states(''input_text.morning_missions_week_key'') != now().strftime(''%G-W%V'') }}'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.child_one_star_mon
      - input_boolean.child_one_star_tue
      - input_boolean.child_one_star_wed
      - input_boolean.child_one_star_thu
      - input_boolean.child_one_star_fri
      - input_boolean.child_one_star_sat
      - input_boolean.child_one_star_sun
      - input_boolean.child_two_star_mon
      - input_boolean.child_two_star_tue
      - input_boolean.child_two_star_wed
      - input_boolean.child_two_star_thu
      - input_boolean.child_two_star_fri
      - input_boolean.child_two_star_sat
      - input_boolean.child_two_star_sun
      - input_boolean.child_three_star_mon
      - input_boolean.child_three_star_tue
      - input_boolean.child_three_star_wed
      - input_boolean.child_three_star_thu
      - input_boolean.child_three_star_fri
      - input_boolean.child_three_star_sat
      - input_boolean.child_three_star_sun
  - action: input_text.set_value
    target:
      entity_id: input_text.morning_missions_week_key
    data:
      value: '{{ now().strftime(''%G-W%V'') }}'
  mode: single
- id: morning_missions_child_one_award
  alias: Morning Missions — Award Child One star
  description: One star per day whenever all six tasks are completed, without a deadline.
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.child_one_brush_teeth
    - input_boolean.child_one_eat_breakfast
    - input_boolean.child_one_get_dressed
    - input_boolean.child_one_socks_shoes
    - input_boolean.child_one_brush_hair
    - input_boolean.child_one_go_potty
    to: 'on'
  conditions:
  - condition: template
    value_template: |-
      {{
                          is_state('input_boolean.child_one_brush_teeth', 'on') and
                          is_state('input_boolean.child_one_eat_breakfast', 'on') and
                          is_state('input_boolean.child_one_get_dressed', 'on') and
                          is_state('input_boolean.child_one_socks_shoes', 'on') and
                          is_state('input_boolean.child_one_brush_hair', 'on') and
                          is_state('input_boolean.child_one_go_potty', 'on')
                          and is_state('input_boolean.child_one_star_' ~
                            ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()], 'off')
                        }}
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: '{{ ''input_boolean.child_one_star_'' ~ [''mon'',''tue'',''wed'',''thu'',''fri'',''sat'',''sun''][now().weekday()] }}'
  mode: single
