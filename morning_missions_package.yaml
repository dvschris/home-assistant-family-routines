  mode: single
- id: morning_missions_apply_animation_preference
  alias: Morning Missions — Apply animation preference
  description: Apply a changed choice immediately for that child only; preserve tasks and stars.
  triggers:
  - trigger: state
    entity_id:
    - input_select.morning_missions_child_one_animation_preference
    - input_select.morning_missions_child_two_animation_preference
    - input_select.morning_missions_child_three_animation_preference
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.from_state is not none and trigger.to_state.state not in [''unknown'',''unavailable''] and trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - variables:
      child: '{{ trigger.entity_id.split(''morning_missions_'')[1].replace(''_animation_preference'','''') }}'
      choices: &id001
        Rocket: rocket
        Flower: flower
        Race car: car
        Steam train: train
        Moon landing: moon
        Pumpkin: pumpkin
        Hatching egg: egg
        Paper airplane: paper_airplane
        Submarine: submarine
        Castle: castle
        T-Rex: dinosaur
        Butterfly: butterfly
        Rainbow: rainbow
        Robot: robot
        Hatching dragon: dragon
      themes:
      - rocket
      - flower
      - car
      - train
      - moon
      - pumpkin
      - egg
      - paper_airplane
      - submarine
      - castle
      - dinosaur
      - butterfly
      - rainbow
      - robot
      - dragon
  - variables:
      target_theme: '{{ ''input_select.morning_missions_'' ~ child ~ ''_theme'' }}'
      fixed: '{{ choices.get(trigger.to_state.state, '''') }}'
  - action: input_select.select_option
    target:
      entity_id: '{{ target_theme }}'
    data:
      option: '{{ fixed if fixed else ((themes | reject(''equalto'', states(target_theme)) | list) | random) }}'
  mode: queued
  max: 10
